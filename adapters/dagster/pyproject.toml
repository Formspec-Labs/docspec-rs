[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docspec-dagster"
version = "0.1.0"
description = "Thin Dagster scheduling over the local Rust DocSpec HTTP API"
requires-python = ">=3.11,<3.15"
dependencies = ["dagster==1.13.16", "pydantic>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
