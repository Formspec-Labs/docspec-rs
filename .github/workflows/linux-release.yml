# Build the linux-amd64 release binary congressional-tech pins, and qualify it.
#
# The build runs in Debian bookworm (glibc 2.36), the baseline eb40c54 was
# qualified on, so the binary also runs on newer glibc hosts (ubuntu-24.04).
# Uploading the runtime artifact and setting DOCSPEC_RUNTIME_ARTIFACT stay
# manual in congressional-tech (scripts/publication/publish-docspec-runtime.py).
name: linux-release

on:
  workflow_dispatch:
    inputs:
      congressional_tech_ref:
        description: congressional-tech ref whose client tests qualify the binary
        default: main
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    container: rust:1.94.0-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        # rust-toolchain.toml selects the toolchain; the image only provides rustup.
        run: cargo build --locked --release --features remote --bin docspec
      - name: Digest
        run: |
          cp target/release/docspec docspec
          sha256sum docspec | tee docspec.sha256
          ldd --version | head -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: docspec-linux-amd64-${{ github.sha }}
          path: |
            docspec
            docspec.sha256
          if-no-files-found: error

  qualify:
    needs: build
    runs-on: ubuntu-24.04
    container: python:3.12-slim-bookworm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docspec-linux-amd64-${{ github.sha }}
          path: /opt/docspec-artifact
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git poppler-utils procps >/dev/null
      - uses: actions/checkout@v4
        with:
          repository: civictechdc/congressional-tech
          ref: ${{ inputs.congressional_tech_ref || 'main' }}
          path: ct
      - name: Pin this binary in the checkout
        working-directory: ct
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          install -m 0755 /opt/docspec-artifact/docspec /opt/docspec
          (cd /opt/docspec-artifact && sha256sum -c docspec.sha256)
          python - <<'PY'
          import json, os, subprocess
          sha = subprocess.run(['sha256sum', '/opt/docspec'], capture_output=True, text=True, check=True).stdout.split()[0]
          path = 'model/docspec-runtime-pin.json'
          pin = json.load(open(path))
          pin['source_revision'] = os.environ['SOURCE_REVISION']
          pin['platforms']['linux-amd64']['sha256'] = sha
          json.dump(pin, open(path, 'w'), indent=2)
          json.dump(dict(version=1, required_capabilities=pin['required_capabilities'], binary='/opt/docspec',
                         binary_sha256=sha, source_revision=pin['source_revision'], platform='linux-amd64',
                         build_features=pin['build_features'], limits=os.path.abspath('.github/docspec-local-limits.json'),
                         workspace='/tmp/ds-work', timeout_seconds=2700), open('/tmp/runtime.json', 'w'))
          PY
      - name: Binary checks
        run: |
          ldd /opt/docspec | { ! grep 'not found'; }
          /opt/docspec --help >/dev/null
          /opt/docspec serve --help | grep -E 'ready-file|shutdown-on-stdin-eof'
      - name: congressional-tech client tests
        working-directory: ct
        env:
          DOCSPEC_BINARY: /opt/docspec
          DOCSPEC_JOB_CONFIG: /tmp/runtime.json
        run: |
          pip install -q -e packages/docspec_client -e 'packages/house-naming[test]' -e packages/committee_meeting \
            -e packages/congress_shared -e packages/viewer_publication -e 'packages/congress_api[archive,test]' \
            -e packages/news_lake -e packages/corpus_recovery -e packages/youtube_api 'PyYAML>=6,<7' pytest
          export PYTHONPATH="$(printf '%s:' "$PWD"/packages/{house-naming,committee_meeting,congress_shared,docspec_client,youtube_api,congress_api,viewer_publication,corpus_recovery,news_lake}/src)$PWD/apps/committee_youtube/src"
          python -m pytest -q -p no:cacheprovider -rs packages/docspec_client/tests \
            packages/congress_api/tests/test_captures_final34.py packages/congress_api/tests/test_captures_version.py
