# Build the linux-amd64 release binary congressional-tech pins, and qualify it.
#
# The build runs in Debian bookworm (glibc 2.36), the baseline eb40c54 was
# qualified on, so the binary also runs on newer glibc hosts (ubuntu-24.04).
# Uploading the runtime artifact and setting DOCSPEC_RUNTIME_ARTIFACT stay
# manual in congressional-tech (scripts/publication/publish-docspec-runtime.py).
name: linux-release

on:
  workflow_dispatch:
    inputs:
      congressional_tech_ref:
        description: congressional-tech ref whose client tests qualify the binary
        default: main
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    container: rust:1.94.0-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        # rust-toolchain.toml selects the toolchain; the image only provides rustup.
        run: cargo build --locked --release --features remote --bin docspec
      - name: Strip and digest
        # [profile.release] keeps debug info for local profiling; the pinned
        # runtime is stripped like eb40c54's, and congressional-tech's
        # publish and setup scripts refuse a runtime of 1 GiB or more.
        run: |
          cp target/release/docspec docspec
          strip docspec
          size=$(stat -c %s docspec)
          echo "docspec bytes: $size"
          test "$size" -lt 1073741824
          sha256sum docspec | tee docspec.sha256
          ldd --version | sed -n 1p  # sed reads to EOF; head can SIGPIPE ldd under pipefail (exit 141)
      - uses: actions/upload-artifact@v4
        with:
          name: docspec-linux-amd64-${{ github.sha }}
          path: |
            docspec
            docspec.sha256
          if-no-files-found: error

  qualify:
    # The whole congressional-tech production-offline lane, through its own runner and
    # setup actions, in the six shards its CI uses. The earlier 54 client tests ran no
    # model SQL, so 425e346 passed here and then failed 46 lane tests on one planner
    # error (ss-x71z): a qualification has to run the SQL the pin will serve.
    name: qualify (production-offline ${{ matrix.shard }}/6)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
        with:
          repository: civictechdc/congressional-tech
          ref: ${{ inputs.congressional_tech_ref || 'main' }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: docspec-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/docspec-artifact
      - uses: ./.github/actions/setup-python-project
      - uses: ./.github/actions/setup-node-project
      - name: Pin this binary in the checkout
        env:
          SOURCE_REVISION: ${{ github.sha }}
          ARTIFACT: ${{ runner.temp }}/docspec-artifact
          BINARY: ${{ runner.temp }}/docspec
          CONFIG: ${{ runner.temp }}/runtime.json
          WORKSPACE: ${{ runner.temp }}/ds-work
        run: |
          (cd "$ARTIFACT" && sha256sum -c docspec.sha256)
          install -m 0555 "$ARTIFACT/docspec" "$BINARY"
          .venv/bin/python - <<'PY'
          import json, os, subprocess
          sha = subprocess.run(['sha256sum', os.environ['BINARY']], capture_output=True, text=True, check=True).stdout.split()[0]
          path = 'model/docspec-runtime-pin.json'
          pin = json.load(open(path))
          pin['source_revision'] = os.environ['SOURCE_REVISION']
          pin['platforms']['linux-amd64']['sha256'] = sha
          json.dump(pin, open(path, 'w'), indent=2)
          json.dump(dict(version=1, required_capabilities=pin['required_capabilities'], binary=os.environ['BINARY'],
                         binary_sha256=sha, source_revision=pin['source_revision'], platform='linux-amd64',
                         build_features=pin['build_features'], limits=os.path.abspath('.github/docspec-local-limits.json'),
                         workspace=os.environ['WORKSPACE'], timeout_seconds=2700), open(os.environ['CONFIG'], 'w'))
          PY
          echo "DOCSPEC_JOB_CONFIG=$CONFIG" >> "$GITHUB_ENV"
          echo "DOCSPEC_BINARY=$BINARY" >> "$GITHUB_ENV"
      - name: Binary checks
        run: |
          ldd "$DOCSPEC_BINARY" | { ! grep 'not found'; }
          "$DOCSPEC_BINARY" --help >/dev/null
          "$DOCSPEC_BINARY" serve --help | grep -E 'ready-file|shutdown-on-stdin-eof'
      - name: congressional-tech production-offline lane
        run: .venv/bin/python scripts/dev.py test production-offline --shard ${{ matrix.shard }}/6
