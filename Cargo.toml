[package]
name = "docspec"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
autotests = false
description = "Recoverable, evidence-bound dataset operations over Apache Iceberg"

# The CLI has no unit tests; integration tests still build and invoke it.
[[bin]]
name = "docspec"
path = "src/main.rs"
test = false

# Share linked dependencies; isolate process-sensitive suites below.
[[test]]
name = "integration"
path = "tests/integration.rs"

# This suite intentionally retains a host descriptor until its process exits.
[[test]]
name = "worker_initialization"
path = "tests/worker_initialization.rs"

# Its child process selects a root-level test by exact name.
[[test]]
name = "restore"
path = "tests/restore.rs"

# Measures a single SQL workload in a fresh child process.
[[test]]
name = "sql_process_memory"
path = "tests/sql_process_memory.rs"

[features]
test-util = []
substrait = ["dep:datafusion-substrait", "dep:prost", "dep:substrait"]
remote = ["dep:iceberg-catalog-rest", "dep:iceberg-storage-opendal", "dep:opendal", "dep:reqwest-rest", "dep:object_store", "dep:typetag"]

[dependencies]
anyhow = "1"
arrow = { version = "58", features = ["ipc", "json"] }
arrow-schema = { version = "=58.4.0", features = ["serde"] }
async-trait = "0.1"
axum = "0.8"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
datafusion = "=53.1.0"
datafusion-substrait = { version = "=53.1.0", default-features = false, optional = true }
prost = { version = "=0.14.4", optional = true }
substrait = { version = "=0.62.2", features = ["serde"], optional = true }
datafusion-functions-json = "=0.53.1"
url = "=2.5.8"
percent-encoding = "=2.3.2"
fs2 = "0.4"
flate2 = "1.1.10"
futures = "0.3"
hashbrown = { version = "=0.17.1", default-features = false }
httpdate = "=1.0.3"
iceberg = "=0.10.1"
iceberg-datafusion = "=0.10.1"
iceberg-catalog-sql = "=0.10.1"
iceberg-catalog-rest = { version = "=0.10.1", optional = true }
iceberg-storage-opendal = { version = "=0.10.1", optional = true, default-features = false, features = ["opendal-s3"] }
# Match DataFusion's locked object_store and enable its maintained S3 reader.
object_store = { version = "=0.13.2", optional = true, default-features = false, features = ["aws"] }
opendal = { version = "=0.57.0", optional = true, default-features = false, features = ["services-s3", "layers-timeout"] }
# Register docspec's Iceberg storage factory (iceberg 0.10.1 uses typetag 0.2).
typetag = { version = "0.2", optional = true }
# Unify rustls-tls on reqwest 0.12 for iceberg-catalog-rest; S3 uses a separate reqwest version.
reqwest-rest = { package = "reqwest", version = "=0.12.28", optional = true, default-features = false, features = ["rustls-tls"] }
mimalloc = "0.1"
md-5 = "=0.10.6"
parquet = { version = "58", features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiter = "=0.13.0"
ryu = "=1.0.23"
sha2 = "=0.10.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "any"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[[example]]
name = "r2_catalog_probe"
required-features = ["remote"]

[[example]]
name = "r2_objects_probe"
required-features = ["remote"]

[[example]]
name = "r2_candidate_probe"
required-features = ["remote"]

[dev-dependencies]
base64 = "=0.22.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Avoid 60-90 GB DataFusion/Arrow incremental debug caches while retaining line-table backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
debug = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[[example]]
name = "basin_maintenance_probe"
required-features = ["remote"]
test = true
