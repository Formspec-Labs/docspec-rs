[package]
name = "docspec"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
autotests = false
description = "Recoverable, evidence-bound dataset operations over Apache Iceberg"

# The CLI has no unit tests; integration tests still build and invoke it.
[[bin]]
name = "docspec"
path = "src/main.rs"
test = false

# Share linked dependencies; isolate process-sensitive suites below.
[[test]]
name = "integration"
path = "tests/integration.rs"

# This suite intentionally retains a host descriptor until its process exits.
[[test]]
name = "worker_initialization"
path = "tests/worker_initialization.rs"

# Its child process selects a root-level test by exact name.
[[test]]
name = "restore"
path = "tests/restore.rs"

# Measures a single SQL workload in a fresh child process.
[[test]]
name = "sql_process_memory"
path = "tests/sql_process_memory.rs"

[features]
test-util = []
substrait = ["dep:datafusion-substrait", "dep:prost", "dep:substrait"]
remote = ["dep:iceberg-catalog-rest", "dep:iceberg-storage-opendal", "dep:opendal", "dep:reqwest-rest", "dep:object_store"]

[dependencies]
base64 = "=0.22.1"
anyhow = "1"
arrow = { version = "59", features = ["ipc", "json"] }
arrow-schema = { version = "=59.3.2", features = ["serde"] }
async-trait = "0.1"
axum = "0.8"
blake3 = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
datafusion = "=55.2.0"
datafusion-substrait = { version = "=55.2.0", default-features = false, optional = true }
prost = { version = "=0.14.4", optional = true }
substrait = { version = "=0.63.0", features = ["serde"], optional = true }
datafusion-functions-json = "=0.55.6"
url = "=2.5.8"
percent-encoding = "=2.3.2"
fs2 = "0.4"
flate2 = "1.1.10"
futures = "0.3"
hashbrown = { version = "=0.17.1", default-features = false }
httpdate = "=1.0.3"
# Unreleased: iceberg-datafusion moved to apache/datafusion-iceberg, whose main
# builds on DataFusion 55 and this iceberg-rust revision. Use the same revision
# here so one iceberg crate serves both.
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3" }
iceberg-datafusion = { git = "https://github.com/apache/datafusion-iceberg", rev = "726e4208f4c2295e17b1bc5747332f6f04e7d965" }
iceberg-catalog-sql = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3" }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3", optional = true }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust", rev = "5b82ab99aeaf50bf4f5b3b776ac9cd6380a5f3e3", optional = true, default-features = false, features = ["opendal-s3"] }
# Match DataFusion's locked object_store and enable its maintained S3 reader.
object_store = { version = "=0.13.2", optional = true, default-features = false, features = ["aws"] }
opendal = { version = "=0.58.2", optional = true, default-features = false, features = ["services-s3", "layers-timeout"] }
# Register docspec's Iceberg storage factory (iceberg uses typetag 0.2).
typetag = "0.2"
# Unify rustls-tls on reqwest 0.12 for iceberg-catalog-rest; S3 uses a separate reqwest version.
reqwest-rest = { package = "reqwest", version = "=0.12.28", optional = true, default-features = false, features = ["rustls-tls"] }
mimalloc = { version = "0.1", features = ["extended"] }
md-5 = "=0.10.6"
parquet = { version = "59", features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiter = "=0.17.0"
# Safe getrlimit/setrlimit for the CLI's open-file limit: std has neither and
# this crate forbids unsafe. Already locked through tempfile.
rustix = { version = "1.1", features = ["process"] }
ryu = "=1.0.23"
sha2 = "=0.10.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "any"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[[example]]
name = "r2_catalog_probe"
required-features = ["remote"]

[[example]]
name = "r2_objects_probe"
required-features = ["remote"]

[[example]]
name = "r2_candidate_probe"
required-features = ["remote"]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Avoid 60-90 GB DataFusion/Arrow incremental debug caches while retaining line-table backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Keep software digest crates fast in dev/test builds when hashing the unstripped test binary.
[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.digest]
opt-level = 2

[profile.dev.package.blake3]
opt-level = 2

[profile.dev.package.md-5]
opt-level = 2

[profile.release]
debug = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[[example]]
name = "basin_maintenance_probe"
required-features = ["remote"]
test = true
